# Minimal lock screen
background {
    monitor =
    color = rgba(21, 23, 32, 1.0)
    blur_passes = 0
}

input-field {
    monitor =
    size = 240, 44
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.3
    outer_color = rgba(42, 53, 80, 1.0)
    inner_color = rgba(29, 32, 39, 1.0)
    font_color = rgba(215, 218, 224, 1.0)
    placeholder_text = <span foreground="##7a828e">Password</span>
    fade_on_empty = false
    rounding = 10
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(215, 218, 224, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = rgba(122, 130, 142, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}
