general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid stacking lockers
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on    # turn screen back on
}

# Lock after 5 min idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off shortly after
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend after 10 min idle
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
