# ═══════════════════════════════════════════════════════════════════
#  Hyprland — minimal config · Intel iGPU primary / NVIDIA offload
#  Managed in ~/dotfiles (symlinked here). Edit there, not in place.
# ═══════════════════════════════════════════════════════════════════

################
### MONITORS ###
################
# Auto-detect every output at its preferred mode. Internal eDP is on Intel.
monitor = , preferred, auto, 1

################
### PROGRAMS ###
################
$terminal    = kitty
$fileManager = nautilus
$menu        = wofi --show drun
$scripts     = ~/.local/bin

#########################
### HYBRID GRAPHICS   ###
#########################
# The compositor renders on the Intel iGPU (smooth, low power, no NVIDIA
# Wayland quirks). NVIDIA stays available on demand: `prime-run <app>`.
# NOTE: AQ_DRM_DEVICES is set by the `hyprland-hybrid` launcher (bin/), NOT here.
# It resolves the Intel card node at runtime, because aquamarine mis-parses the
# ':' in /dev/dri/by-path names and cardN numbering is unstable across boots.
# Launch via `hyprland-hybrid` (TTY) or the "Hyprland (hybrid)" session in ly.

# Default GPU/VAAPI to Intel/mesa (prime-run overrides these for NVIDIA apps)
env = LIBVA_DRIVER_NAME,iHD
env = __GLX_VENDOR_LIBRARY_NAME,mesa
env = NVD_BACKEND,direct

#############
### THEME ###
#############
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,16
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,16

# Toolkits on Wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = _JAVA_AWT_WM_NONREPARENTING,1

#################
### AUTOSTART ###
#################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORM
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = $scripts/theme.sh apply
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hypridle
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Bibata-Modern-Classic 16

# Active colour palette — swapped by theme.sh (dark <-> light)
source = ~/.config/hypr/theme.conf

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $border_inactive
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    # No blur, no shadows — minimal look and buttery-smooth on the iGPU.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

cursor {
    no_hardware_cursors = 2   # auto — avoids cursor glitches on hybrid GPUs
    inactive_timeout = 5
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Touchpad: 3-finger horizontal swipe between workspaces (0.56 gesture syntax)
gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################
# Mirrors the gh0stzk sxhkd scheme so muscle memory carries over.
$mod = SUPER

# ── Applications ──────────────────────────────────────────────
bind = $mod, Return, exec, kitty
bind = $mod ALT, Return, exec, kitty --class kitty-float
bind = $mod, b, exec, firefox
bind = $mod, e, exec, geany
bind = $mod, f, exec, thunar
bind = $mod, y, exec, kitty -e yazi
bind = $mod, v, exec, kitty -e nvim
bind = $mod, m, exec, kitty -e ncmpcpp
bind = $mod, p, exec, pavucontrol
bind = $mod, t, exec, telegram-desktop
bind = $mod, w, exec, firefox --new-tab https://web.whatsapp.com/

# ── Launcher & search ─────────────────────────────────────────
bind = CTRL ALT, s, exec, wofi --show drun            # app launcher (sxhkd chord)
bind = $mod, space, exec, wofi --show drun            # app launcher (extra)
bind = $mod SHIFT, f, exec, kitty --class kitty-float -e $scripts/filesearch.sh  # fast file search (fzf)

# ── Applets (super+alt, sxhkd chords) ─────────────────────────
bind = $mod ALT, n, exec, nm-connection-editor        # network
bind = $mod ALT, b, exec, blueman-manager             # bluetooth
bind = $mod ALT, c, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy  # clipboard
bind = $mod ALT, s, exec, $scripts/screenshot.sh area # screenshot
bind = $mod ALT, p, exec, $scripts/powermenu.sh       # power menu
bind = $mod ALT, o, togglespecialworkspace, magic     # scratchpad
bind = ALT, space, exec, $scripts/theme.sh toggle     # switch dark <-> light theme

# ── System control (sxhkd: ctrl+super+alt+…) ──────────────────
bind = CTRL $mod ALT, p, exec, systemctl poweroff
bind = CTRL $mod ALT, r, exec, systemctl reboot
bind = CTRL $mod ALT, q, exit,
bind = CTRL $mod ALT, l, exec, hyprlock
bind = CTRL $mod ALT, k, exec, hyprctl kill           # click a window to kill (xkill)
bind = CTRL $mod ALT, s, exec, hyprctl reload         # soft reload
bind = $mod, Escape, exec, hyprctl reload             # reload config (sxhkd chord)

# ── Window state ──────────────────────────────────────────────
bind = $mod, c, killactive,                           # close  (sxhkd: super+c)
bind = $mod SHIFT, c, killactive,                     # kill
bind = ALT, a, togglefloating,                        # floating
bind = ALT, f, fullscreen, 0                          # fullscreen
bind = ALT SHIFT, t, pseudo,                          # pseudo-tiled
bind = ALT, s, pin,                                   # sticky
bind = $mod, a, fullscreen, 1                         # monocle (maximize)
bind = $mod, j, layoutmsg, togglesplit                # flip split direction

# ── Workspaces ────────────────────────────────────────────────
bind = $mod, left,  workspace, e-1                    # prev workspace
bind = $mod, right, workspace, e+1                    # next workspace
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Send window to workspace (sxhkd: super+ctrl+number)
bind = $mod CTRL, 1, movetoworkspace, 1
bind = $mod CTRL, 2, movetoworkspace, 2
bind = $mod CTRL, 3, movetoworkspace, 3
bind = $mod CTRL, 4, movetoworkspace, 4
bind = $mod CTRL, 5, movetoworkspace, 5
bind = $mod CTRL, 6, movetoworkspace, 6
bind = $mod CTRL, 7, movetoworkspace, 7
bind = $mod CTRL, 8, movetoworkspace, 8
bind = $mod CTRL, 9, movetoworkspace, 9
bind = $mod CTRL, 0, movetoworkspace, 10
bind = $mod CTRL, left,  movetoworkspace, e-1
bind = $mod CTRL, right, movetoworkspace, e+1
bind = CTRL SHIFT, period, workspace, previous        # last workspace

# ── Focus / swap / move (arrows) ──────────────────────────────
bind = $mod ALT, left,  movefocus, l                  # focus  (super+alt)
bind = $mod ALT, right, movefocus, r
bind = $mod ALT, up,    movefocus, u
bind = $mod ALT, down,  movefocus, d
bind = CTRL ALT, left,  swapwindow, l                 # swap   (ctrl+alt)
bind = CTRL ALT, right, swapwindow, r
bind = CTRL ALT, up,    swapwindow, u
bind = CTRL ALT, down,  swapwindow, d
bind = $mod SHIFT, left,  moveactive, -40 0           # move floating (super+shift)
bind = $mod SHIFT, right, moveactive, 40 0
bind = $mod SHIFT, up,    moveactive, 0 -40
bind = $mod SHIFT, down,  moveactive, 0 40
bind = CTRL SHIFT, comma, focuscurrentorlast          # last window

# ── Window switcher (Alt-Tab) ─────────────────────────────────
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop

# ── Resize ────────────────────────────────────────────────────
bind = $mod ALT, plus,   resizeactive, 40 40
bind = $mod ALT, minus,  resizeactive, -40 -40
bind = $mod CTRL, plus,  resizeactive, 40 40
bind = $mod CTRL, minus, resizeactive, -40 -40

# ── System monitor ────────────────────────────────────────────
bind = $mod SHIFT, Escape, exec, kitty -e btop

# ── Mouse ─────────────────────────────────────────────────────
bind  = $mod, mouse_down, workspace, e+1
bind  = $mod, mouse_up,   workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Screenshots ───────────────────────────────────────────────
bind = , Print,     exec, $scripts/screenshot.sh area
bind = $mod, Print, exec, $scripts/screenshot.sh screen

# NOTE: gh0stzk applets with no Hyprland analogue are omitted on purpose:
#   super+alt+{w,t,a,l,k,x} (wall/term/android/rofi-style/keyboard/pass),
#   alt+space (rice selector), super+r (rice editor), super+n;… chords.

##########################
### HARDWARE KEYS      ###
##########################
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

####################
### WINDOW RULES ###
####################
# NOTE: this Hyprland (0.56.2) uses SPACE-separated windowrule syntax — no comma
# between the rule and its selectors. Verified against the running instance.
windowrule = float class:^(nm-connection-editor|blueman-manager|pavucontrol)$
windowrule = float class:^(org.pulseaudio.pavucontrol)$
# Floating dropdown terminal (super+alt+Return)
windowrule = float class:^(kitty-float)$
windowrule = size 60% 55% class:^(kitty-float)$
windowrule = center class:^(kitty-float)$
windowrule = float title:^(Open File|Save File|Choose Files)(.*)$
