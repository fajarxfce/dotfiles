# ═══════════════════════════════════════════════════════════════════
#  Hyprland — minimal config · Intel iGPU primary / NVIDIA offload
#  Managed in ~/dotfiles (symlinked here). Edit there, not in place.
# ═══════════════════════════════════════════════════════════════════

################
### MONITORS ###
################
# Auto-detect every output at its preferred mode. Internal eDP is on Intel.
monitor = , preferred, auto, 1

################
### PROGRAMS ###
################
$terminal    = kitty
$fileManager = nautilus
$menu        = wofi --show drun
$scripts     = ~/.local/bin

#########################
### HYBRID GRAPHICS   ###
#########################
# The compositor renders on the Intel iGPU (smooth, low power, no NVIDIA
# Wayland quirks). NVIDIA stays available on demand: `prime-run <app>`.
# by-path is used because card0/card1 numbering is NOT stable across boots.
env = AQ_DRM_DEVICES,/dev/dri/by-path/pci-0000:00:02.0-card:/dev/dri/by-path/pci-0000:01:00.0-card

# Default GPU/VAAPI to Intel/mesa (prime-run overrides these for NVIDIA apps)
env = LIBVA_DRIVER_NAME,iHD
env = __GLX_VENDOR_LIBRARY_NAME,mesa
env = NVD_BACKEND,direct

#############
### THEME ###
#############
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,16
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,16

# Toolkits on Wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = _JAVA_AWT_WM_NONREPARENTING,1

#################
### AUTOSTART ###
#################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORM
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = swaybg -m fill -c 151720
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hypridle
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Bibata-Modern-Classic 16

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(8aa2c8ff)
    col.inactive_border = rgba(2a2e37aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0
    # No blur, no shadows — minimal look and buttery-smooth on the iGPU.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    animation = windows,    1, 3, smooth, popin 80%
    animation = windowsOut, 1, 3, smooth, popin 80%
    animation = border,     1, 5, smooth
    animation = fade,       1, 3, smooth
    animation = workspaces, 1, 3, smooth, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true            # variable refresh rate — saves power when idle
    focus_on_activate = true
}

cursor {
    no_hardware_cursors = 2   # auto — avoids cursor glitches on hybrid GPUs
    inactive_timeout = 5
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
}

###################
### KEYBINDINGS ###
###################
$mod = SUPER

# Apps
bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, R, exec, $menu
bind = $mod, Space, exec, $menu
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, L, exec, hyprlock
bind = $mod, Escape, exec, $scripts/powermenu.sh

# Clipboard history
bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Window management
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,

# Focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Special (scratchpad) workspace
bind = $mod, grave, togglespecialworkspace, magic
bind = $mod SHIFT, grave, movetoworkspace, special:magic

# Scroll / mouse
bind  = $mod, mouse_down, workspace, e+1
bind  = $mod, mouse_up,   workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots
bind = , Print,       exec, $scripts/screenshot.sh area
bind = $mod, Print,   exec, $scripts/screenshot.sh screen
bind = $mod SHIFT, S, exec, $scripts/screenshot.sh area

##########################
### HARDWARE KEYS      ###
##########################
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

####################
### WINDOW RULES ###
####################
windowrule = suppressevent maximize, class:.*
windowrule = float, class:^(nm-connection-editor|blueman-manager|pavucontrol)$
windowrule = float, class:^(org.pulseaudio.pavucontrol)$
windowrule = float, title:^(Open File|Save File|Choose Files)(.*)$
# Fix occasional focus grab from empty XWayland surfaces
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
